<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadmap Belajar Database & PHP MySQL</title>
<style>
  :root{
    --bg:#0f1117;
    --panel:#171a23;
    --panel2:#1e2230;
    --border:#2a2f3f;
    --text:#e9ebf2;
    --muted:#9aa0b4;
    --accent:#6c8cff;
    --accent2:#3ddc97;
    --track:#2a2f3f;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f5fa;
      --panel:#ffffff;
      --panel2:#f0f1f8;
      --border:#e1e3ee;
      --text:#1c1f2b;
      --muted:#666c82;
      --track:#e5e7f2;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .wrap{width:100%;max-width:620px;}
  header{margin-bottom:20px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  p.sub{color:var(--muted);margin:0 0 18px;font-size:0.92rem;}

  .progress-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:20px;
  }
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .progress-top .count{font-weight:700;font-size:1.05rem;}
  .progress-top .pct{color:var(--accent2);font-weight:700;}
  .bar-track{height:10px;background:var(--track);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease;border-radius:99px;}

  ul.list{list-style:none;margin:0;padding:0;}
  li.item{position:relative;}
  li.item .connector{
    position:absolute;
    left:23px;top:-14px;
    width:2px;height:14px;
    background:var(--border);
  }
  li.item:first-child .connector{display:none;}

  .row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-top:14px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .row:hover{border-color:var(--accent);}
  .row.done{background:var(--panel2);opacity:.75;}

  .checkbox{
    flex:0 0 auto;
    width:24px;height:24px;
    border-radius:7px;
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    margin-top:2px;
    transition:background .15s ease, border-color .15s ease;
  }
  .row.done .checkbox{background:var(--accent2);border-color:var(--accent2);}
  .checkbox svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:opacity .15s ease, transform .15s ease;}
  .row.done .checkbox svg{opacity:1;transform:scale(1);}

  .label{flex:1;}
  .num{color:var(--accent);font-weight:700;font-size:.78rem;letter-spacing:.02em;}
  .title{font-size:1rem;margin-top:2px;}
  .row.done .title{text-decoration:line-through;color:var(--muted);}

  footer{margin-top:26px;display:flex;justify-content:center;}
  .reset-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:9px 16px;
    border-radius:99px;
    font-size:.85rem;
    cursor:pointer;
  }
  .reset-btn:hover{border-color:#e0556f;color:#e0556f;}

  .done-banner{
    display:none;
    text-align:center;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0b0d13;
    font-weight:700;
    padding:12px;
    border-radius:14px;
    margin-bottom:20px;
  }
  .done-banner.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗄️ Roadmap Belajar Database & PHP MySQL</h1>
    <p class="sub">Centang setiap tahap yang sudah kamu pelajari. Progress tersimpan otomatis di browser ini.</p>
  </header>

  <div class="done-banner" id="doneBanner">🎉 Mantap! Semua tahap sudah selesai kamu pelajari!</div>

  <div class="progress-card">
    <div class="progress-top">
      <span class="count"><span id="countDone">0</span>/<span id="countTotal">18</span> selesai</span>
      <span class="pct" id="pct">0%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <ul class="list" id="list"></ul>

  <footer>
    <button class="reset-btn" id="resetBtn">Reset semua progress</button>
  </footer>
</div>

<script>
const topics = [
  "Pahami database",
  "Pahami MySQL",
  "Kenali phpMyAdmin",
  "Buat Database",
  "Buat Table",
  "Buat Column",
  "Masukkan Data",
  "Pelajari SQL dasar",
  "Hubungkan PHP ↔ MySQL",
  "INSERT dari PHP",
  "SELECT dari PHP",
  "UPDATE dari PHP",
  "DELETE dari PHP",
  "CRUD lengkap",
  "Login & Register",
  "Relasi antar tabel",
  "JOIN",
  "Project nyata"
];

const STORAGE_KEY = "db-roadmap-progress-v1";
let state = {};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : {};
  }catch(e){
    state = {};
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){}
}

const listEl = document.getElementById('list');
const barFill = document.getElementById('barFill');
const pctEl = document.getElementById('pct');
const countDoneEl = document.getElementById('countDone');
const countTotalEl = document.getElementById('countTotal');
const doneBanner = document.getElementById('doneBanner');

function render(){
  listEl.innerHTML = '';
  topics.forEach((title, i) => {
    const li = document.createElement('li');
    li.className = 'item';
    const isDone = !!state[i];
    li.innerHTML = `
      <div class="connector"></div>
      <div class="row ${isDone ? 'done' : ''}" data-idx="${i}">
        <div class="checkbox">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6.5" stroke="#0b0d13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="label">
          <div class="num">TAHAP ${i+1}</div>
          <div class="title">${title}</div>
        </div>
      </div>
    `;
    listEl.appendChild(li);
  });

  document.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => {
      const idx = row.getAttribute('data-idx');
      state[idx] = !state[idx];
      saveState();
      render();
    });
  });

  updateProgress();
}

function updateProgress(){
  const total = topics.length;
  const done = topics.reduce((acc, _, i) => acc + (state[i] ? 1 : 0), 0);
  const pct = Math.round((done/total)*100);
  countDoneEl.textContent = done;
  countTotalEl.textContent = total;
  pctEl.textContent = pct + '%';
  barFill.style.width = pct + '%';
  doneBanner.classList.toggle('show', done === total);
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Yakin mau reset semua progress?')){
    state = {};
    saveState();
    render();
  }
});

loadState();
render();
</script>
</body>
  </html>
